<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Éditeur · RaceLeague</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
  </head>
  <body>
    <canvas id="scene" aria-label="Grille de l'éditeur"></canvas>

    <header class="ed-top">
      <button class="icon-btn" id="backBtn" aria-label="Retour au menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <input id="mapName" class="name-input" maxlength="40" aria-label="Nom du circuit" />
      <div class="status" id="status" role="status"></div>
      <div class="spacer"></div>
      <button class="btn" id="codeBtn">Code</button>
      <button class="btn btn-primary" id="testBtn">Tester</button>
    </header>

    <nav class="palette" id="palette" aria-label="Pièces"></nav>

    <div class="toolbar" role="toolbar" aria-label="Outils">
      <button class="tool" id="rotBtn" title="Tourner la pièce (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Tourner</span></button>
      <button class="tool" id="eraseBtn" title="Gomme (X)" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg><span>Gomme</span></button>
      <div class="level" title="Étage (Page haut / Page bas)">
        <button class="tool sm" id="lvlDown" aria-label="Étage du dessous">−</button>
        <span>Étage <b id="lvl">0</b></span>
        <button class="tool sm" id="lvlUp" aria-label="Étage du dessus">+</button>
      </div>
      <button class="tool" id="undoBtn" title="Annuler (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Annuler</span></button>
      <button class="tool" id="camBtn" title="Tourner la vue (Q / E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Vue</span></button>
    </div>

    <div class="help" id="help">Clic : poser · Clic droit : effacer · Glisser : déplacer · Molette : zoom · R : tourner · Q/E : vue</div>

    <div class="overlay" id="codeModal" hidden>
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
        <h2 id="codeTitle">Code du circuit</h2>
        <p class="sub">Ce texte contient tout le circuit. Copie-le pour le garder ou l'envoyer.</p>
        <textarea id="codeOut" readonly rows="3"></textarea>
        <div class="row"><button class="btn btn-primary" id="copyBtn">Copier le code</button></div>

        <h3>Ouvrir un code</h3>
        <textarea id="codeIn" rows="2" placeholder="Colle un code RL1-…"></textarea>
        <div class="row"><button class="btn" id="loadBtn">Ouvrir</button><span class="err" id="loadErr"></span></div>

        <h3>Mes circuits</h3>
        <ul class="saved" id="savedList"></ul>
        <div class="row">
          <button class="btn" id="saveBtn">Enregistrer ce circuit</button>
          <button class="btn" id="newBtn">Nouveau circuit</button>
          <button class="btn" id="exampleBtn">Exemple</button>
        </div>
        <button class="btn btn-primary close" id="closeCode">Fermer</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
